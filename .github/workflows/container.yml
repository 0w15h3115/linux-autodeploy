name: Kali container suite

# Split out of ci.yml because path filters apply per workflow, not per job:
# expressing "run the slow suite only when the deploy script or the tests
# actually change" is not possible from a job-level `if:`.
on:
  push:
    branches: [main]
    paths:
      - 'kali-autodeploy-physical'
      - 'tests/**'
      - '.github/workflows/container.yml'
  pull_request:
  # Kali is a rolling release: a metapackage can be renamed, or a new
  # dependency conflict introduced, without anything in this repo changing.
  # The weekly run surfaces that drift while you are at a desk rather than
  # partway through a reimage.
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Full suite against kalilinux/kali-rolling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run suite
        run: tests/run-tests.sh
